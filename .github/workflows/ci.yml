name: OKF CI & Security Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Shannon Entropy Gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Test Suite (Shannon Entropy & Graph Validator)
      run: |
        python -m unittest discover -s tests -v

    - name: Verify Core Sanitization Engine Standalone
      run: |
        python core/sanitize_okf.py "Testing path sanitization C:\Users\dummy and clean tokens"
